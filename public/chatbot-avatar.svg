<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none" role="img" aria-label="AI Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b0a6"/>
      <stop offset="0.55" stop-color="#0a7d7f"/>
      <stop offset="1" stop-color="#005E60"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3427"/>
      <stop offset="1" stop-color="#241512"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9b8"/>
      <stop offset="1" stop-color="#f2b98d"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3b45"/>
      <stop offset="1" stop-color="#0e2830"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDA6B"/>
      <stop offset="1" stop-color="#F8C21C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <!-- Background -->
    <rect width="200" height="200" fill="url(#bg)"/>
    <rect width="200" height="200" fill="url(#glow)"/>
    <circle cx="40" cy="34" r="7" fill="#ffffff" opacity="0.12"/>
    <circle cx="164" cy="52" r="4" fill="#ffffff" opacity="0.14"/>
    <circle cx="150" cy="30" r="2.5" fill="#ffffff" opacity="0.18"/>

    <!-- Shoulders / blazer -->
    <path d="M34 200c0-33 30-56 66-56s66 23 66 56H34z" fill="url(#blazer)"/>
    <path d="M100 150c-9 0-17 3-24 8l24 42 24-42c-7-5-15-8-24-8z" fill="#f6f2ec"/>
    <path d="M100 150l-9 10 9 12 9-12-9-10z" fill="#0e2830"/>
    <circle cx="100" cy="184" r="2.4" fill="url(#gold)"/>

    <!-- Neck -->
    <path d="M88 132h24v14c0 7-5 12-12 12s-12-5-12-12v-14z" fill="#eab488"/>

    <!-- Hair (back) -->
    <path d="M52 96c0-30 20-52 48-52s48 22 48 52c0 22-6 40-14 50V86H66v60c-8-10-14-28-14-50z" fill="url(#hair)"/>

    <!-- Face -->
    <path d="M64 92c0-22 15-38 36-38s36 16 36 38-14 46-36 46-36-24-36-46z" fill="url(#skin)"/>
    <path d="M64 92c0 8 2 16 5 23-4-3-7-9-7-16 0-3 1-5 2-7z" fill="#e7a877" opacity="0.5"/>

    <!-- Fringe -->
    <path d="M63 92c-3-25 14-42 37-42s39 17 36 42c-5-8-8-17-10-22-9 12-38 12-51 4-2 5-8 10-12 18z" fill="url(#hair)"/>

    <!-- Eyes -->
    <ellipse cx="85" cy="94" rx="4" ry="5.2" fill="#2b1a14"/>
    <ellipse cx="115" cy="94" rx="4" ry="5.2" fill="#2b1a14"/>
    <circle cx="86.4" cy="92" r="1.4" fill="#fff"/>
    <circle cx="116.4" cy="92" r="1.4" fill="#fff"/>
    <!-- Lashes -->
    <path d="M79 89c3-2 8-2 12 0" stroke="#2b1a14" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M109 89c3-2 8-2 12 0" stroke="#2b1a14" stroke-width="1.6" stroke-linecap="round" fill="none"/>

    <!-- Brows -->
    <path d="M78 84c4-2.5 10-2.5 14 0" stroke="#3a2418" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M108 84c4-2.5 10-2.5 14 0" stroke="#3a2418" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <path d="M100 96v9c0 2-1.6 3.5-3.6 3.5" stroke="#d99a6c" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Smile -->
    <path d="M89 114c6 5 16 5 22 0" stroke="#b25a48" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M91 115c5 3 13 3 18 0" fill="#fff" opacity="0.85"/>

    <!-- Cheeks -->
    <circle cx="78" cy="106" r="4.5" fill="#f08e78" opacity="0.45"/>
    <circle cx="122" cy="106" r="4.5" fill="#f08e78" opacity="0.45"/>

    <!-- Headset -->
    <path d="M62 96a38 38 0 0 1 76 0" stroke="url(#gold)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="55" y="94" width="12" height="20" rx="5" fill="url(#gold)"/>
    <rect x="133" y="94" width="12" height="20" rx="5" fill="url(#gold)"/>
    <path d="M139 106v12c0 8-7 13-16 13" stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="121" cy="131" r="4.5" fill="url(#gold)"/>
  </g>

  <!-- Rim -->
  <circle cx="100" cy="100" r="98" stroke="#ffffff" stroke-width="3" opacity="0.55" fill="none"/>
</svg>
