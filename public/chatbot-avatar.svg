<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-label="AI Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a7d7f"/>
      <stop offset="1" stop-color="#005E60"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#241814"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <!-- Background -->
    <rect width="160" height="160" fill="url(#bg)"/>
    <circle cx="80" cy="150" r="70" fill="#ffffff" opacity="0.10"/>

    <!-- Shoulders / blazer -->
    <path d="M32 160c0-26 21-44 48-44s48 18 48 44H32z" fill="#12313a"/>
    <path d="M64 122h32l-6 38H70l-6-38z" fill="#f4f1ec"/>

    <!-- Neck -->
    <rect x="70" y="104" width="20" height="20" rx="8" fill="#e7b48f"/>

    <!-- Hair back -->
    <path d="M44 78c0-24 16-42 36-42s36 18 36 42c0 16-4 30-10 38V72H54v44c-6-8-10-22-10-38z" fill="url(#hair)"/>

    <!-- Face -->
    <path d="M52 74c0-18 12-30 28-30s28 12 28 30-12 40-28 40-28-22-28-40z" fill="#f3c19a"/>

    <!-- Hair front / fringe -->
    <path d="M52 74c-2-22 12-36 28-36s30 14 28 36c-4-6-6-14-8-18-6 8-30 10-40 4-2 4-6 8-8 14z" fill="url(#hair)"/>

    <!-- Eyes -->
    <ellipse cx="69" cy="76" rx="3.4" ry="4.2" fill="#2b1d18"/>
    <ellipse cx="91" cy="76" rx="3.4" ry="4.2" fill="#2b1d18"/>
    <circle cx="70.2" cy="74.6" r="1.1" fill="#fff"/>
    <circle cx="92.2" cy="74.6" r="1.1" fill="#fff"/>

    <!-- Brows -->
    <path d="M63 69c3-2 8-2 11 0" stroke="#3a2a22" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M86 69c3-2 8-2 11 0" stroke="#3a2a22" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Smile -->
    <path d="M72 90c4 4 12 4 16 0" stroke="#a65a4a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <circle cx="63" cy="84" r="3.5" fill="#eda37f" opacity="0.5"/>
    <circle cx="97" cy="84" r="3.5" fill="#eda37f" opacity="0.5"/>

    <!-- Headset -->
    <path d="M50 78a30 30 0 0 1 60 0" stroke="#F8C21C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="45" y="76" width="10" height="16" rx="4" fill="#F8C21C"/>
    <rect x="105" y="76" width="10" height="16" rx="4" fill="#F8C21C"/>
    <!-- Mic -->
    <path d="M110 84v10c0 6-6 10-12 10" stroke="#F8C21C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="97" cy="104" r="3.5" fill="#F8C21C"/>
  </g>

  <!-- Online ring -->
  <circle cx="80" cy="80" r="78" stroke="#ffffff" stroke-width="3" opacity="0.5" fill="none"/>
</svg>
